{% extends 'base.html' %}
{% block title %}Set New Password - AI Blog{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16" data-aos="fade-up">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
        <h1 class="text-3xl font-bold mb-6 text-center">Set New Password</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-1">New Password</label>
                <input type="password" name="new_password1" class="w-full px-4 py-2 rounded border dark:bg-gray-700 dark:border-gray-600" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Confirm Password</label>
                <input type="password" name="new_password2" class="w-full px-4 py-2 rounded border dark:bg-gray-700 dark:border-gray-600" required>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
