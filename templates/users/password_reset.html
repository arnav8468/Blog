{% extends 'base.html' %}
{% block title %}Password Reset - AI Blog{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16" data-aos="fade-up">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
        <h1 class="text-3xl font-bold mb-6 text-center">Reset Password</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-6 text-center">Enter your email to receive a password reset link.</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" class="w-full px-4 py-2 rounded border dark:bg-gray-700 dark:border-gray-600" required>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock %}
