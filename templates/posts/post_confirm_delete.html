{% extends 'base.html' %}
{% block title %}Delete Post - AI Blog{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16" data-aos="fade-up">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 text-center">
        <h1 class="text-3xl font-bold mb-4">Delete Post?</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8">Are you sure you want to delete "{{ post.title }}"? This action cannot be undone.</p>
        <form method="post" class="flex gap-4 justify-center">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition">Delete</button>
            <a href="{% url 'posts:post_detail' post.slug %}" class="px-6 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:shadow transition">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
